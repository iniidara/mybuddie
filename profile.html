<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | MyBuddie</title>
    <link rel="stylesheet" href="profilestyle.css">
</head>
<body>
    <div id="blue_bar">
        <div id="banner-text">
            MyBuddie &nbsp &nbsp<input type="text" id="search-box" placeholder="I'm looking for...">
            <img src="images/selfie.jpg" alt="">
        </div>
    </div>

    <div class="cover-area">
        <div class="bg-image">
            <img src="images/mountain.jpg" alt="cover">
        </div>
        <div class="profile-header">
            <img class="profile-pic" src="images/selfie.jpg" alt="profile">
            <div class="profile-info">
                <h1>Mary Banda</h1>
                <p>Having Fun</p>
            </div>
        </div>
        <nav class="profile-nav">
            <a href="#" class="nav-item active">Timeline</a>
            <a href="#" class="nav-item">About</a>
            <a href="#" class="nav-item">Photos</a>
            <a href="#" class="nav-item">Friends</a>
            <a href="#" class="nav-item">Settings</a>
        </nav>

        <div class="profile-menu">
            <aside class="sidebar">
                <div class="friends-section">
                    <h2>Friends</h2>
                    <div class="friends-container">
                        <div class="friend-card">
                            <img class="friend-avatar" src="images/user1.jpg" alt="John Doe">
                            <p class="friend-name">John Doe</p>
                        </div>

                        <div class="friend-card">
                            <img class="friend-avatar" src="images/user1.jpg" alt="John Doe">
                            <p class="friend-name">John Doe</p>
                        </div>

                        <div class="friend-card">
                            <img class="friend-avatar" src="images/user1.jpg" alt="John Doe">
                            <p class="friend-name">John Doe</p>
                        </div>
                    </div>
                </div>
            </aside>
            <div class="posts-section">

                <div class="post-placeholder">
                    <textarea placeholder="What I'm Offering The World"></textarea>
                    <button type="submit" class="post-button">Post</button>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
