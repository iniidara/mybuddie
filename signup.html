<!DOCTYPE html>
<html lang="en">
    <head>
        <title>MyBuddie | Signup</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header id="bar">
            <div id="large-text">MyBuddie</div>
            <a id="signupbtn" href="login.html">Log in</a>
        </header>
        
        <main id="form-bg">
            <h1>Signup to MyBuddie</h1>

            <input type="text" class="input-field" placeholder="First Name" autocomplete="given-name">
            <input type="text" class="input-field" placeholder="Last Name" autocomplete="family-name">
            <span class="field-label">Gender:</span>
            <select name="gender" class="input-field">
                <option value="">Select gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            <input type="email" class="input-field" placeholder="Email" autocomplete="email">
            <input type="password" class="input-field" placeholder="Password" autocomplete="new-password">
            <input type="password" class="input-field" placeholder="Retype Password" autocomplete="new-password">
            <button type="submit" id="submit">Sign up</button>
            <p class="form-note">Already have an account? <a href="login.html">Log in</a>.</p>
        </main>

         <footer>&copy; MyBuddie App</footer>
    </body>
</html>
