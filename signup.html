<!DOCTYPE html>
<html>
    <head>
        <title>MyBuddie | Signup</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div id="bar">

            <div id="large-text">MyBuddie</div>
            <div id="signupbtn">Signup</div>

        </div>
        
        <div id="form-bg">
            Signup To MyBuddie <br><br>

            <input type="name" class="input-field" placeholder="First Name" autocomplete="on">
            <input type="name" class="input-field" placeholder="Last Name" autocomplete="on">
            <span>Gender:</span><br> 
            <select name="" class="input-field">
                <option value="">Male</option>
                <option value="">Female</option>
            </select> <br><br>

            <input type="email" class="input-field" placeholder="Email" autocomplete="on">

            <input type="password" class="input-field" placeholder="Password" autocomplete="on">
            <input type="password" class="input-field" placeholder="Retype Password" autocomplete="on">
            <button type="submit" id="submit" value="Signup">Sign up</button>
            <br><br><br>
        </div>

         <footer>&copy;MyBuddie App</footer>
    </body>
</html>
